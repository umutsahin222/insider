name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Go + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./... && go vet -tags integration ./... && go vet -tags acceptance ./test/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: OpenAPI contract
        run: make lint-api
      - name: Claude Code hooks
        run: make test-hooks

  test:
    name: Tests (unit + integration, -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Integration tests start Postgres and Redis with testcontainers on the runner's Docker.
      - name: go test
        run: make test

  e2e:
    name: End-to-end (compose, smoke, acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test
        run: make smoke
      - name: Acceptance suite (one test per requirement)
        run: make acceptance
      - name: Scale workers and re-run
        run: |
          docker compose up -d --scale worker=3 --wait --wait-timeout 120
          make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

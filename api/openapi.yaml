openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    Event-driven notification system delivering SMS, email and push messages.

    Notifications are accepted synchronously (persisted and queued) and delivered
    asynchronously by channel workers, rate limited to 100 messages/second per channel.

    **Correlation:** every request may carry `X-Correlation-ID`; if absent one is generated.
    It is echoed in the response, stored with the notification and propagated to the provider.

    **Errors** use RFC 9457 Problem Details (`application/problem+json`).
servers:
  - url: http://localhost:8080
tags:
  - name: notifications
    description: Create, query, cancel and retry individual notifications.
  - name: batches
    description: Track and cancel notifications created together.
  - name: templates
    description: Reusable message bodies with variable substitution.
  - name: realtime
    description: Live status updates over WebSocket.
  - name: ops
    description: Health checks and metrics.

paths:
  /v1/notifications:
    post:
      tags: [notifications]
      operationId: createNotification
      summary: Create a notification
      description: |
        Validates and enqueues one notification. Supply either `content` or `template`.
        A template is rendered at creation; the rendered text is stored as `content` and
        validated like literal content (e.g. the 160-character SMS limit). An unknown template,
        a channel mismatch or a missing variable is a `422` on `template.name` /
        `template.variables`.

        With an `Idempotency-Key` header, repeating the request returns the originally
        created notification with `200 OK` instead of creating a duplicate. Reusing the key
        with a different request body is rejected with `422` (see ADR-006).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotificationRequest' }
            examples:
              sms:
                value: { channel: sms, recipient: '+905551234567', content: 'Your code is 1234', priority: high }
              scheduledEmail:
                value:
                  channel: email
                  recipient: user@example.com
                  content: Flash sale starts now!
                  scheduled_at: '2026-11-20T09:00:00Z'
              fromTemplate:
                value:
                  channel: sms
                  recipient: '+905551234567'
                  template: { name: otp, variables: { code: '1234' } }
      responses:
        '201':
          description: Created and queued.
          headers:
            Location:
              schema: { type: string }
              description: URL of the created notification.
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '200':
          description: Idempotent replay; the notification created by the first request.
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailedOrKeyReused' }
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List notifications
      description: Newest first, keyset (cursor) pagination.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/Status' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - name: batch_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: Inclusive lower bound on `created_at`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound on `created_at`.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque `next_cursor` from a previous page.
          schema: { type: string }
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/notifications/batch:
    post:
      tags: [notifications, batches]
      operationId: createBatch
      summary: Create up to 1000 notifications at once
      description: |
        All-or-nothing: the batch is validated as a whole and inserted in one transaction.
        Validation errors reference items by index, e.g. `items[3].recipient`.
        Idempotency works at two levels:
        - **Batch:** with an `Idempotency-Key` header, repeating the request returns the
          original batch (same `batch_id` and `notification_ids`, in request order) with
          `200 OK`. Reusing the key with different items is rejected with `422`.
        - **Item:** `idempotency_key` on an item; if any item key already exists the whole
          batch is rejected with `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBatchRequest' }
      responses:
        '201':
          description: Batch created and queued.
          headers:
            Location:
              schema: { type: string }
              description: URL of the batch summary.
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCreated' }
        '200':
          description: Idempotent replay; the batch created by the first request.
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
            Location:
              schema: { type: string }
              description: URL of the batch summary.
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailedOrKeyReused' }

  /v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificationID'
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Get a notification with its delivery attempts
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/notifications/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/NotificationID'
    post:
      tags: [notifications]
      operationId: cancelNotification
      summary: Cancel a pending notification
      description: Only `pending` notifications (including scheduled ones) can be cancelled.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/notifications/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/NotificationID'
    post:
      tags: [notifications]
      operationId: retryNotification
      summary: Re-queue a failed notification
      description: |
        Moves a `failed` notification (the dead-letter set) back to `pending`, due now, with a
        fresh attempt budget: `max_attempts` becomes `attempts + MAX_ATTEMPTS`. Attempt numbers
        keep counting up (6, 7, …) so the delivery history in `delivery_attempts` is preserved.
        Any other status is a `409`.
      responses:
        '200':
          description: Re-queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/batches/{id}:
    parameters:
      - $ref: '#/components/parameters/BatchID'
    get:
      tags: [batches]
      operationId: getBatch
      summary: Get batch status summary
      description: Use `GET /v1/notifications?batch_id=` to page through the items.
      responses:
        '200':
          description: Batch summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/batches/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BatchID'
    post:
      tags: [batches]
      operationId: cancelBatch
      summary: Cancel every still-pending notification of a batch
      responses:
        '200':
          description: Number of notifications cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [batch_id, cancelled]
                properties:
                  batch_id: { type: string, format: uuid }
                  cancelled: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/stats:
    get:
      tags: [ops]
      operationId: getStats
      summary: Delivery statistics
      description: |
        Current backlog per channel plus delivery success rate and latency percentiles over
        a recent window. Computed from the database, so it aggregates every worker replica
        and needs no Prometheus server. Every channel is always listed (zero-filled).
      parameters:
        - name: window
          in: query
          description: Go duration between 10s and 24h.
          schema: { type: string, default: 5m, examples: [5m, 1h] }
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/templates:
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a message template
      description: |
        Bodies use a subset of Go `text/template` syntax, e.g. `Your code is {{.code}}`:
        variables (`{{.name}}`, `{{index . "name"}}`, `{{$v := .name}}`), literals, comments,
        `if`/`else`/`with`, and the functions `eq ne lt le gt ge and or not len index`.
        `range`, `define`/`template`/`block`, `break`/`continue` and other functions are
        rejected (422 on `body`) so rendering stays linear in template and variable size.
        Missing variables at render time are a validation error; variables may total 64 KiB and
        rendered output 64 KiB. Templates are immutable (there is no update): existing
        notifications keep referring to exactly what they rendered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      responses:
        '200':
          description: All templates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }

  /v1/ws:
    get:
      tags: [realtime]
      operationId: subscribeStatus
      summary: Real-time status updates (WebSocket)
      description: |
        Upgrades to a WebSocket and streams `StatusEvent` JSON text messages for the given
        notification or batch. Exactly one of `notification_id` / `batch_id` is required;
        both are checked before upgrading (`400` / `404`).

        1. On connect the server sends a **snapshot**: one event per notification with its
           current state (a batch sends one per item).
        2. Then it forwards **live events** (`processing`, `sent`, `pending` after a failed
           attempt or a release, `failed`, `cancelled`). An event can repeat a snapshot state;
           order events of one notification by `attempts`.
        3. If the server cannot guarantee completeness — the client fell behind, the API lost
           its Redis subscription, or the API is shutting down — it closes with status
           **1013 (Try Again Later)**. Reconnect to receive a fresh snapshot.

        The server never expects client messages and pings every 30 s. Browser clients from
        other origins must be allowed via `WS_ALLOWED_ORIGINS`. Example:
        `curl --no-buffer "ws://localhost:8080/v1/ws?batch_id=<id>"`.
      parameters:
        - name: notification_id
          in: query
          schema: { type: string, format: uuid }
        - name: batch_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '101':
          description: Switching protocols; messages are `StatusEvent` objects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusEvent' }
        '400':
          description: |
            Invalid query parameters (problem+json, as `BadRequest`), or an invalid WebSocket
            handshake such as a bad `Sec-WebSocket-Version` or `Sec-WebSocket-Key` (plain text,
            written by the WebSocket library).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            text/plain:
              schema: { type: string }
        '403':
          description: |
            The browser's `Origin` is not allowed. Same-origin and non-browser clients are always
            allowed; other origins must be listed in `WS_ALLOWED_ORIGINS`. Plain text, written by
            the WebSocket library during the handshake.
          content:
            text/plain:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '426':
          description: 'Not a WebSocket upgrade request (missing `Connection: Upgrade` / `Upgrade: websocket`). Plain text.'
          content:
            text/plain:
              schema: { type: string }

  /healthz:
    get:
      tags: [ops]
      operationId: liveness
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    get:
      tags: [ops]
      operationId: readiness
      summary: Readiness probe (checks PostgreSQL and Redis)
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapiSpec
      summary: This OpenAPI document
      responses:
        '200':
          description: The contract, as served by the running API.
          content:
            application/yaml:
              schema: { type: string }

  /docs:
    get:
      tags: [ops]
      operationId: apiDocs
      summary: Interactive API documentation (Swagger UI)
      responses:
        '200':
          description: An HTML page rendering /openapi.yaml with Swagger UI.
          content:
            text/html:
              schema: { type: string }

  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics
      description: |
        Prometheus exposition of the API process. Queue metrics are read from the database at
        scrape time (cached for 1 s):
        - `notification_queue_depth{channel,priority,state}` – state is `ready`, `delayed` or `processing`
        - `notification_queue_oldest_ready_age_seconds{channel}` – queue lag
        - `notification_queue_stats_up`
        - `notifications_accepted_total{channel,priority}`
        - `http_requests_total{method,route,status}`, `http_request_duration_seconds{method,route}`
        - `websocket_connections` – open status streams

        Delivery metrics are exposed by each worker on its own `HTTP_ADDR` (default `:9091`):
        `notification_deliveries_total{channel,outcome,result}`,
        `notification_provider_request_duration_seconds{channel,outcome}`,
        `notification_end_to_end_latency_seconds{channel}`, `notification_rate_limit_wait_seconds{channel}`,
        `notification_releases_total{channel,reason}`, `notification_circuit_breaker_state{channel}`,
        `notification_reaper_reclaimed_total`. See ADR-007.
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    NotificationID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key (≤255 bytes) that makes the create request safe to retry. The key is
        bound to a fingerprint of the request body; reusing it with a different body is a `422`.
      schema: { type: string, maxLength: 255 }
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Stored with the notification, written to every log line and forwarded to the provider.
        A missing value, or one that does not match the pattern, is **replaced** by a generated
        UUID (not rejected); the value actually used is returned in the `X-Correlation-ID`
        response header.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }

  headers:
    CorrelationID:
      description: |
        The correlation ID used for this request: the client's `X-Correlation-ID` if it matched
        `^[A-Za-z0-9._:-]{1,128}$`, otherwise a generated UUID. Set on every response.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, bad query parameter).
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Request body exceeds the limit (1 MiB single, 16 MiB batch).
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found (also returned for malformed IDs).
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The resource is not in a state that allows this operation, or a uniqueness constraint was violated.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailedOrKeyReused:
      description: |
        Semantically invalid input (`errors` lists every invalid field), or the
        `Idempotency-Key` was already used with a different request body
        (title "Idempotency key reused").
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Semantically invalid input; `errors` lists every invalid field.
      headers:
        X-Correlation-ID: { $ref: '#/components/headers/CorrelationID' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Validation failed
            status: 422
            correlation_id: 0b6c1c2e-6c3b-4c1e-9a55-0d6f0a7b8c9d
            errors:
              - { field: 'items[3].recipient', message: 'must be an E.164 phone number, e.g. +905551234567' }

  schemas:
    Channel:
      type: string
      enum: [sms, email, push]
    Priority:
      type: string
      enum: [high, normal, low]
      default: normal
    Status:
      type: string
      enum: [pending, processing, sent, failed, cancelled]
      description: |
        `pending → processing → sent`; on a retryable error `processing → pending` with backoff;
        `failed` after a permanent error or exhausted attempts; `pending → cancelled` by the user.

    TemplateRef:
      type: object
      required: [name]
      properties:
        name: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }

    CreateNotificationRequest:
      type: object
      required: [channel, recipient]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        recipient:
          type: string
          description: E.164 phone number (sms), email address (email) or device token (push).
        content:
          type: string
          description: |
            Message body. Limits (characters): sms 160, email 10000, push 256.
            Mutually exclusive with `template`.
        template: { $ref: '#/components/schemas/TemplateRef' }
        priority: { $ref: '#/components/schemas/Priority' }
        scheduled_at:
          type: string
          format: date-time
          description: Deliver no earlier than this time (at most 30 days ahead). Past values mean "now".

    CreateBatchItem:
      allOf:
        - $ref: '#/components/schemas/CreateNotificationRequest'
        - type: object
          properties:
            idempotency_key: { type: string, maxLength: 255 }

    CreateBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/CreateBatchItem' }

    BatchCreated:
      type: object
      required: [batch_id, count, notification_ids]
      properties:
        batch_id: { type: string, format: uuid }
        count: { type: integer }
        notification_ids:
          type: array
          description: In the same order as the request items.
          items: { type: string, format: uuid }

    QueueCounts:
      type: object
      required: [ready, delayed, processing]
      properties:
        ready: { type: integer, description: Pending and due now. }
        delayed: { type: integer, description: Pending but scheduled later or backing off a retry. }
        processing: { type: integer, description: Claimed by a worker. }

    Latency:
      type: object
      description: Percentiles in milliseconds; 0 when there is no data.
      required: [p50, p95, p99]
      properties:
        p50: { type: number }
        p95: { type: number }
        p99: { type: number }

    Stats:
      type: object
      required: [window_seconds, generated_at, queue, delivery]
      properties:
        window_seconds: { type: integer }
        generated_at: { type: string, format: date-time }
        queue:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/QueueCounts'
              - type: object
                required: [channel, oldest_ready_age_seconds, by_priority]
                properties:
                  channel: { $ref: '#/components/schemas/Channel' }
                  oldest_ready_age_seconds:
                    type: number
                    description: How long the oldest due notification has waited (queue lag).
                  by_priority:
                    type: object
                    description: Every priority is present (zeros if empty).
                    required: [high, normal, low]
                    properties:
                      high: { $ref: '#/components/schemas/QueueCounts' }
                      normal: { $ref: '#/components/schemas/QueueCounts' }
                      low: { $ref: '#/components/schemas/QueueCounts' }
        delivery:
          type: array
          items:
            type: object
            required: [channel, attempts, succeeded, retryable_errors, permanent_errors, success_rate,
              sent, failed, provider_latency_ms, end_to_end_latency_ms]
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              attempts: { type: integer, description: Provider calls in the window. }
              succeeded: { type: integer }
              retryable_errors: { type: integer }
              permanent_errors: { type: integer }
              success_rate:
                type: [number, 'null']
                description: succeeded / attempts; null when there were no attempts.
              sent: { type: integer, description: Notifications sent in the window. }
              failed: { type: integer, description: Notifications that failed permanently in the window. }
              provider_latency_ms: { $ref: '#/components/schemas/Latency' }
              end_to_end_latency_ms:
                allOf:
                  - $ref: '#/components/schemas/Latency'
                description: From becoming due (created or scheduled) to sent, including retries.
          example:
            - channel: email
              attempts: 408
              succeeded: 280
              retryable_errors: 128
              permanent_errors: 0
              success_rate: 0.686
              sent: 280
              failed: 0
              provider_latency_ms: { p50: 30, p95: 39, p99: 40 }
              end_to_end_latency_ms: { p50: 2360.729, p95: 4414.305, p99: 5431.368 }

    BatchSummary:
      type: object
      required: [batch_id, total, counts]
      properties:
        batch_id: { type: string, format: uuid }
        total: { type: integer }
        counts:
          type: object
          description: Number of notifications per status; every status is present (0 if none).
          required: [pending, processing, sent, failed, cancelled]
          properties:
            pending: { type: integer }
            processing: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
            cancelled: { type: integer }

    Notification:
      type: object
      description: Every property is always present; nullable ones are `null` when unset.
      required: [id, batch_id, idempotency_key, channel, recipient, content, template_id, priority, status,
        scheduled_at, next_attempt_at, attempts, max_attempts, last_error, provider_message_id,
        correlation_id, created_at, updated_at, sent_at]
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        idempotency_key: { type: [string, 'null'] }
        channel: { $ref: '#/components/schemas/Channel' }
        recipient: { type: string }
        content: { type: string }
        template_id: { type: [string, 'null'], format: uuid }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        scheduled_at: { type: [string, 'null'], format: date-time }
        next_attempt_at: { type: string, format: date-time }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: [string, 'null'] }
        provider_message_id: { type: [string, 'null'] }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }

    DeliveryAttempt:
      type: object
      required: [attempt, outcome, status_code, error, duration_ms, created_at]
      properties:
        attempt: { type: integer }
        outcome:
          type: string
          enum: [success, retryable_error, permanent_error]
        status_code: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }

    NotificationDetail:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          required: [delivery_attempts]
          properties:
            delivery_attempts:
              type: array
              items: { $ref: '#/components/schemas/DeliveryAttempt' }

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page; null on the last page.

    CreateTemplateRequest:
      type: object
      required: [name, channel, body]
      properties:
        name: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
        channel: { $ref: '#/components/schemas/Channel' }
        body: { type: string, maxLength: 20000, description: 'Template body in the supported subset (see createTemplate).' }

    Template:
      type: object
      required: [id, name, channel, body, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        body: { type: string }
        created_at: { type: string, format: date-time }

    StatusEvent:
      type: object
      description: |
        A notification reached `status`. `error` explains a failed attempt (`pending` after a
        retryable failure, or `failed`). Published best-effort; the database stays the truth.
      required: [notification_id, batch_id, status, attempts, error, occurred_at]
      properties:
        notification_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        attempts: { type: integer }
        error: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }
          example: { postgres: ok, redis: ok }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: 'items[3].recipient' }
        message: { type: string }

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

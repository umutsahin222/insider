global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS discovery scrapes every replica (docker compose --scale) under the service name.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091
        refresh_interval: 5s
